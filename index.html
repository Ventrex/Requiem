<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>REQUIEM</title>
<style>html,body{margin:0;height:100%;background:#000;color:#ddd;font:16px system-ui;display:grid;place-items:center}#status{padding:24px;text-align:center}</style>
</head>
<body><div id="status">REQUIEM laden…</div>
<script>
(async()=>{
 try{
  const r=await fetch('https://api.github.com/repos/Ventrex/Requiem/git/blobs/cdcad8fbc173141da5e105fbe31548084fd50686',{cache:'no-store'});
  if(!r.ok)throw new Error('GitHub bron kon niet worden geladen ('+r.status+')');
  const j=await r.json();
  const bytes=Uint8Array.from(atob(j.content.replace(/\s/g,'')),c=>c.charCodeAt(0));
  let html=new TextDecoder('utf-8').decode(bytes);

  html=html.replace("{x:1180,900,kind:'ammo'}","{x:1180,y:900,kind:'ammo'}");
  html=html.replace("{x:2200,y:500,t:'thug',wp:[[2200,y=500],[2200,1100]]}","{x:2200,y:500,t:'thug',wp:[[2200,500],[2200,1100]]}");
  html=html.replace("['VOSS','The locket was in his desk. He never opened it. Some treasures are only treasures to the one who remembers.']},","['VOSS','The locket was in his desk. He never opened it. Some treasures are only treasures to the one who remembers.']]},");

  const touchCss=`
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <style>
   html,body,canvas{touch-action:none;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
   #touchUI{position:fixed;inset:0;z-index:9999;pointer-events:none;font-family:system-ui,sans-serif}
   #dpad,#actions{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));pointer-events:auto}
   #dpad{left:18px;width:170px;height:170px}
   #actions{right:18px;width:210px;height:190px}
   .tb{position:absolute;width:58px;height:58px;border-radius:50%;border:2px solid rgba(255,255,255,.42);background:rgba(10,12,18,.62);color:white;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;box-shadow:0 3px 12px #0008;-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px)}
   .tb.on{background:rgba(160,22,35,.86);transform:scale(.94)}
   #up{left:56px;top:0}#down{left:56px;top:112px}#left{left:0;top:56px}#right{left:112px;top:56px}
   #fire{width:82px;height:82px;right:0;bottom:40px;background:rgba(130,15,25,.72)}
   #focus{right:92px;bottom:102px}#use{right:92px;bottom:32px}#reload{right:30px;bottom:132px;width:48px;height:48px;font-size:14px}#weapon{right:150px;bottom:100px;width:50px;height:50px;font-size:13px}
   #aimHint{position:absolute;right:18px;top:max(18px,env(safe-area-inset-top));color:#fff8;background:#0008;padding:7px 10px;border-radius:8px;font-size:12px}
   @media (pointer:fine){#touchUI{display:none}}
   @media (max-width:700px){#dpad{transform:scale(.82);transform-origin:left bottom}#actions{transform:scale(.82);transform-origin:right bottom}}
  </style>`;

  const touchHtml=`
  <div id="touchUI">
   <div id="aimHint">Sleep rechts om te richten</div>
   <div id="dpad"><div class="tb" id="up">▲</div><div class="tb" id="down">▼</div><div class="tb" id="left">◀</div><div class="tb" id="right">▶</div></div>
   <div id="actions"><div class="tb" id="fire">FIRE</div><div class="tb" id="focus">FOCUS</div><div class="tb" id="use">E</div><div class="tb" id="reload">R</div><div class="tb" id="weapon">GUN</div></div>
  </div>`;

  const touchJs=`
  <script>
  (()=>{
   const press=(id,code)=>{const el=document.getElementById(id);if(!el)return;
    const on=e=>{e.preventDefault();e.stopPropagation();keys[code]=true;el.classList.add('on');if(typeof initAudio==='function')initAudio();};
    const off=e=>{e.preventDefault();e.stopPropagation();keys[code]=false;el.classList.remove('on');};
    el.addEventListener('pointerdown',on);el.addEventListener('pointerup',off);el.addEventListener('pointercancel',off);el.addEventListener('pointerleave',off);
   };
   press('up','KeyW');press('down','KeyS');press('left','KeyA');press('right','KeyD');
   const tap=(id,fn)=>{const el=document.getElementById(id);if(!el)return;el.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();el.classList.add('on');if(typeof initAudio==='function')initAudio();fn();});el.addEventListener('pointerup',()=>el.classList.remove('on'));el.addEventListener('pointercancel',()=>el.classList.remove('on'));};
   const fire=document.getElementById('fire');if(fire){fire.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();if(typeof initAudio==='function')initAudio();mouse.down=true;fire.classList.add('on');if(typeof onClick==='function')onClick();});const stop=e=>{e.preventDefault();mouse.down=false;fire.classList.remove('on');};fire.addEventListener('pointerup',stop);fire.addEventListener('pointercancel',stop);}
   const focus=document.getElementById('focus');if(focus){focus.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();mouse.rdown=true;focus.classList.add('on');});const stop=e=>{e.preventDefault();mouse.rdown=false;focus.classList.remove('on');};focus.addEventListener('pointerup',stop);focus.addEventListener('pointercancel',stop);}
   tap('use',()=>typeof onKey==='function'&&onKey('KeyE'));
   tap('reload',()=>typeof onKey==='function'&&onKey('KeyR'));
   let weaponStep=0;tap('weapon',()=>{weaponStep=(weaponStep+1)%3;typeof onKey==='function'&&onKey(weaponStep===0?'Digit1':weaponStep===1?'Digit2':'Digit3');});
   let aimPointer=null;
   document.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'||e.clientX<innerWidth*.45||e.target.closest('#touchUI'))return;aimPointer=e.pointerId;mouse.x=e.clientX;mouse.y=e.clientY;},{passive:false});
   document.addEventListener('pointermove',e=>{if(e.pointerId!==aimPointer)return;e.preventDefault();mouse.x=e.clientX;mouse.y=e.clientY;},{passive:false});
   document.addEventListener('pointerup',e=>{if(e.pointerId===aimPointer)aimPointer=null;});
   document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});
  })();
  <\/script>`;

  html=html.replace('</head>',touchCss+'</head>');
  html=html.replace('<canvas id="c"></canvas>','<canvas id="c"></canvas>'+touchHtml);
  html=html.replace('</body>',touchJs+'</body>');

  document.open();document.write(html);document.close();
 }catch(e){document.getElementById('status').innerHTML='<b>REQUIEM kon niet starten</b><br><br>'+e.message;console.error(e);}
})();
</script></body></html>
