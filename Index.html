<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>REQUIEM — a noir action story</title>
<style>
  html,body{margin:0;padding:0;background:#000;overflow:hidden;height:100%;cursor:none}
  canvas{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/* ================================================================
   REQUIEM — top-down noir action (Door Kickers x John Wick)
   ================================================================ */
const cv=document.getElementById('c'),cx=cv.getContext('2d');
let VW=0,VH=0,VIG=null,GRAIN=null;
function makeGrain(){GRAIN=document.createElement('canvas');GRAIN.width=GRAIN.height=160;
 const g=GRAIN.getContext('2d'),d=g.createImageData(160,160);
 for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255;}
 g.putImageData(d,0,0);}
function makeVig(){VIG=document.createElement('canvas');VIG.width=VW;VIG.height=VH;
 const g=VIG.getContext('2d'),r=g.createRadialGradient(VW/2,VH/2,Math.min(VW,VH)*.35,VW/2,VH/2,Math.max(VW,VH)*.72);
 r.addColorStop(0,'rgba(0,0,0,0)');r.addColorStop(1,'rgba(0,0,0,.62)');g.fillStyle=r;g.fillRect(0,0,VW,VH);}
function resize(){VW=cv.width=innerWidth;VH=cv.height=innerHeight;makeVig();}
addEventListener('resize',resize);makeGrain();resize();

/* ---------------- input ---------------- */
const keys={},mouse={x:innerWidth/2,y:innerHeight/2,down:false,rdown:false};
addEventListener('keydown',e=>{keys[e.code]=true;
 if(['Space','Tab','KeyE','KeyR'].includes(e.code))e.preventDefault();onKey(e.code);});
addEventListener('keyup',e=>keys[e.code]=false);
addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;});
addEventListener('mousedown',e=>{initAudio();if(e.button===0){mouse.down=true;onClick();}if(e.button===2)mouse.rdown=true;});
addEventListener('mouseup',e=>{if(e.button===0)mouse.down=false;if(e.button===2)mouse.rdown=false;});
addEventListener('contextmenu',e=>e.preventDefault());

/* ================================================================
   AUDIO — everything synthesized
   ================================================================ */
let AC=null,master,sfxG,musG,musLP,noiseB,delayN,muted=false;
function initAudio(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
 master=AC.createGain();master.gain.value=.9;master.connect(AC.destination);
 sfxG=AC.createGain();sfxG.gain.value=1;sfxG.connect(master);
 musLP=AC.createBiquadFilter();musLP.type='lowpass';musLP.frequency.value=16000;
 musG=AC.createGain();musG.gain.value=.42;musG.connect(musLP);musLP.connect(master);
 delayN=AC.createDelay(1);delayN.delayTime.value=.34;const fb=AC.createGain();fb.gain.value=.34;
 delayN.connect(fb);fb.connect(delayN);const dw=AC.createGain();dw.gain.value=.35;delayN.connect(dw);dw.connect(musG);
 noiseB=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);
 const d=noiseB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
 // rain bed
 const r=AC.createBufferSource();r.buffer=noiseB;r.loop=true;
 const rf=AC.createBiquadFilter();rf.type='lowpass';rf.frequency.value=850;
 const rg=AC.createGain();rg.gain.value=.05;r.connect(rf);rf.connect(rg);rg.connect(master);r.start();
 mus.next=AC.currentTime+.1;}
function nsrc(){const s=AC.createBufferSource();s.buffer=noiseB;s.loop=true;return s;}
function vol(v){const g=AC.createGain();g.gain.value=v;return g;}
/* --- SFX --- */
function sShoot(kind,v=1){if(!AC||muted)return;const t=AC.currentTime;v=Math.min(1,v);if(v<=.02)return;
 const n=nsrc(),f=AC.createBiquadFilter(),g=AC.createGain();n.connect(f);f.connect(g);g.connect(sfxG);
 if(kind==='sil'){f.type='highpass';f.frequency.value=1500;
  g.gain.setValueAtTime(.22*v,t);g.gain.exponentialRampToValueAtTime(.001,t+.08);n.start(t);n.stop(t+.09);
  const o=AC.createOscillator(),og=AC.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(60,t+.06);
  og.gain.setValueAtTime(.16*v,t);og.gain.exponentialRampToValueAtTime(.001,t+.07);o.connect(og);og.connect(sfxG);o.start(t);o.stop(t+.08);}
 else if(kind==='shotgun'){f.type='lowpass';f.frequency.value=1400;
  g.gain.setValueAtTime(.8*v,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);n.start(t);n.stop(t+.32);
  const o=AC.createOscillator(),og=AC.createGain();o.frequency.setValueAtTime(110,t);o.frequency.exponentialRampToValueAtTime(35,t+.22);
  og.gain.setValueAtTime(.7*v,t);og.gain.exponentialRampToValueAtTime(.001,t+.26);o.connect(og);og.connect(sfxG);o.start(t);o.stop(t+.28);}
 else{const hp=kind==='rifle'?600:kind==='smg'?1200:900;f.type='highpass';f.frequency.value=hp;
  const dur=kind==='rifle'?.22:kind==='smg'?.1:.14,pk=(kind==='rifle'?.6:.5)*v;
  g.gain.setValueAtTime(pk,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);n.start(t);n.stop(t+dur+.02);
  const o=AC.createOscillator(),og=AC.createGain();o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(45,t+.1);
  og.gain.setValueAtTime(.3*v,t);og.gain.exponentialRampToValueAtTime(.001,t+.12);o.connect(og);og.connect(sfxG);o.start(t);o.stop(t+.13);}}
function sClick(f0,v=.2){if(!AC||muted)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
 o.type='square';o.frequency.value=f0;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+.04);
 o.connect(g);g.connect(sfxG);o.start(t);o.stop(t+.05);}
function sReload(){sClick(700,.18);setTimeout(()=>sClick(500,.2),180);setTimeout(()=>sClick(900,.15),420);}
function sStep(run,v=.5){if(!AC||muted)return;const t=AC.currentTime,n=nsrc(),f=AC.createBiquadFilter(),g=AC.createGain();
 f.type='lowpass';f.frequency.value=420;n.connect(f);f.connect(g);g.connect(sfxG);
 g.gain.setValueAtTime((run?.09:.055)*v,t);g.gain.exponentialRampToValueAtTime(.001,t+.06);n.start(t);n.stop(t+.07);}
function sDoor(){if(!AC||muted)return;const t=AC.currentTime,n=nsrc(),f=AC.createBiquadFilter(),g=AC.createGain();
 f.type='lowpass';f.frequency.value=900;n.connect(f);f.connect(g);g.connect(sfxG);
 g.gain.setValueAtTime(.6,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);n.start(t);n.stop(t+.27);
 const o=AC.createOscillator(),og=AC.createGain();o.frequency.setValueAtTime(90,t);o.frequency.exponentialRampToValueAtTime(40,t+.2);
 og.gain.setValueAtTime(.5,t);og.gain.exponentialRampToValueAtTime(.001,t+.24);o.connect(og);og.connect(sfxG);o.start(t);o.stop(t+.26);}
function sDie(v=1){if(!AC||muted)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
 o.type='sawtooth';o.frequency.setValueAtTime(160,t);o.frequency.exponentialRampToValueAtTime(55,t+.25);
 g.gain.setValueAtTime(.14*v,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.connect(g);g.connect(sfxG);o.start(t);o.stop(t+.32);
 const n=nsrc(),nf=AC.createBiquadFilter(),ng=AC.createGain();nf.type='lowpass';nf.frequency.value=300;n.connect(nf);nf.connect(ng);ng.connect(sfxG);
 ng.gain.setValueAtTime(.2*v,t+.08);ng.gain.exponentialRampToValueAtTime(.001,t+.3);n.start(t+.08);n.stop(t+.32);}
function sHurt(){if(!AC||muted)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
 o.frequency.setValueAtTime(200,t);o.frequency.exponentialRampToValueAtTime(70,t+.15);
 g.gain.setValueAtTime(.35,t);g.gain.exponentialRampToValueAtTime(.001,t+.18);o.connect(g);g.connect(sfxG);o.start(t);o.stop(t+.2);}
function sPick(){if(!AC||muted)return;const t=AC.currentTime;[660,990].forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();
 o.frequency.value=f;g.gain.setValueAtTime(.001,t+i*.07);g.gain.linearRampToValueAtTime(.16,t+i*.07+.02);
 g.gain.exponentialRampToValueAtTime(.001,t+i*.07+.14);o.connect(g);g.connect(sfxG);o.start(t+i*.07);o.stop(t+i*.07+.16);});}
function sWhoosh(){if(!AC||muted)return;const t=AC.currentTime,n=nsrc(),f=AC.createBiquadFilter(),g=AC.createGain();
 f.type='bandpass';f.frequency.setValueAtTime(400,t);f.frequency.exponentialRampToValueAtTime(2400,t+.18);
 n.connect(f);f.connect(g);g.connect(sfxG);g.gain.setValueAtTime(.001,t);g.gain.linearRampToValueAtTime(.2,t+.05);
 g.gain.exponentialRampToValueAtTime(.001,t+.2);n.start(t);n.stop(t+.22);}
function sRico(v=.4){if(!AC||muted)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
 o.type='triangle';o.frequency.setValueAtTime(2600+Math.random()*1200,t);o.frequency.exponentialRampToValueAtTime(900,t+.09);
 g.gain.setValueAtTime(.1*v,t);g.gain.exponentialRampToValueAtTime(.001,t+.1);o.connect(g);g.connect(sfxG);o.start(t);o.stop(t+.11);}
function sHeart(){if(!AC||muted)return;const t=AC.currentTime;[0,.18].forEach(d=>{const o=AC.createOscillator(),g=AC.createGain();
 o.frequency.setValueAtTime(60,t+d);o.frequency.exponentialRampToValueAtTime(38,t+d+.08);
 g.gain.setValueAtTime(.5,t+d);g.gain.exponentialRampToValueAtTime(.001,t+d+.1);o.connect(g);g.connect(sfxG);o.start(t+d);o.stop(t+d+.12);});}
function sPiano(f,v=.2){if(!AC||muted)return;const t=AC.currentTime;
 [1,2.01].forEach((m,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=f*m;
  g.gain.setValueAtTime(v*(i?.3:1),t);g.gain.exponentialRampToValueAtTime(.001,t+2.2);
  o.connect(g);g.connect(musG);g.connect(delayN);o.start(t);o.stop(t+2.3);});}
/* --- music sequencer --- */
const mus={mode:'menu',step:0,next:0,spb:60/112/2};
const PENT=[146.83,174.61,196,220,261.63,293.66,349.23];
const BASSL1=[73.42,73.42,0,73.42,87.31,0,73.42,65.41];
const ARPL2=[220,261.63,329.63,293.66,220,261.63,392,329.63];
function kick(t,v=.5){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(120,t);
 o.frequency.exponentialRampToValueAtTime(38,t+.12);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+.16);
 o.connect(g);g.connect(musG);o.start(t);o.stop(t+.18);}
function hat(t,v=.12){const n=nsrc(),f=AC.createBiquadFilter(),g=AC.createGain();f.type='highpass';f.frequency.value=7000;
 n.connect(f);f.connect(g);g.connect(musG);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+.04);n.start(t);n.stop(t+.05);}
function bass(t,fr,dur=.2,v=.3){const o=AC.createOscillator(),f=AC.createBiquadFilter(),g=AC.createGain();
 o.type='square';o.frequency.value=fr;f.type='lowpass';f.frequency.value=420;
 o.connect(f);f.connect(g);g.connect(musG);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
 o.start(t);o.stop(t+dur+.02);}
function pluck(t,fr,v=.14){const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=fr;
 g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+.22);o.connect(g);g.connect(musG);g.connect(delayN);o.start(t);o.stop(t+.25);}
function pad(t,fr,dur=3,v=.07){[0,.5].forEach(dt=>{const o=AC.createOscillator(),g=AC.createGain();
 o.type='sawtooth';o.frequency.value=fr;o.detune.value=dt?8:-8;o.connect(g);g.connect(musG);
 g.gain.setValueAtTime(.001,t);g.gain.linearRampToValueAtTime(v,t+.8);g.gain.linearRampToValueAtTime(.001,t+dur);
 o.start(t);o.stop(t+dur+.1);});}
function tickMusic(){if(!AC||muted)return;
 while(mus.next<AC.currentTime+.28){const s=mus.step,t=mus.next,m=mus.mode;
  if(m==='menu'||m==='cut'){if(s%16===0){pad(t,PENT[Math.floor(Math.random()*3)]*0.5,4,.06);}
   if(s%8===0&&Math.random()<.5)sPiano(PENT[Math.floor(Math.random()*PENT.length)],.12);}
  else if(m==='l1'){mus.spb=60/108/2;if(s%4===0)kick(t,.4);if(s%4===2)hat(t,.07);
   const b=BASSL1[(s>>1)%8];if(b&&s%2===0)bass(t,b,.22,.24);if(s%16===0)pad(t,73.42,3.2,.06);}
  else if(m==='l2'){mus.spb=60/124/2;if(s%2===0)kick(t,.5);hat(t,(s%2)?.13:.05);
   if(s%2===1)bass(t,98,.12,.2);if(s%2===0)pluck(t,ARPL2[(s>>1)%8],.1);}
  else if(m==='l3'){mus.spb=60/96/2;if(s%8===0)kick(t,.5);if(s%8===4)kick(t,.3);if(s%4===2)hat(t,.06);
   if(s%4===0)bass(t,s%16<8?65.41:73.42,.4,.3);if(s%32===0)pad(t,65.41,6,.08);}
  mus.step++;mus.next+=mus.spb;}}

/* ================================================================
   HELPERS
   ================================================================ */
const R=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const dist=(a,b,c,d)=>Math.hypot(c-a,d-b);
const angDiff=(a,b)=>{let d=(b-a)%(Math.PI*2);if(d>Math.PI)d-=Math.PI*2;if(d<-Math.PI)d+=Math.PI*2;return d;};
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);
 g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function seeded(s){return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
function circRectHit(o,r){const cxp=clamp(o.x,r.x,r.x+r.w),cyp=clamp(o.y,r.y,r.y+r.h);
 let dx=o.x-cxp,dy=o.y-cyp,d2=dx*dx+dy*dy;if(d2>=o.r*o.r)return false;
 const d=Math.sqrt(d2)||.001,p=o.r-d;o.x+=dx/d*p;o.y+=dy/d*p;return true;}
function circCircHit(o,c){let dx=o.x-c.x,dy=o.y-c.y,d=Math.hypot(dx,dy),m=o.r+c.r;
 if(d>=m||d===0)return false;o.x+=dx/d*(m-d);o.y+=dy/d*(m-d);return true;}
function collideWorld(o,L){for(let k=0;k<2;k++){for(const w of L.walls)circRectHit(o,w);
 for(const c of L.circles)circCircHit(o,c);}}
function segHitsRect(x1,y1,x2,y2,r){let t0=0,t1=1;const dx=x2-x1,dy=y2-y1;
 const p=[-dx,dx,-dy,dy],q=[x1-r.x,r.x+r.w-x1,y1-r.y,r.y+r.h-y1];
 for(let i=0;i<4;i++){if(Math.abs(p[i])<1e-9){if(q[i]<0)return false;}
  else{const t=q[i]/p[i];if(p[i]<0){if(t>t1)return false;if(t>t0)t0=t;}else{if(t<t0)return false;if(t<t1)t1=t;}}}
 return true;}
function los(L,x1,y1,x2,y2){for(const w of L.walls)if(segHitsRect(x1,y1,x2,y2,w))return false;return true;}
function att(x,y){if(!P)return 1;return clamp(1-dist(x,y,P.x,P.y)/1100,0,1);}
function addNoise(x,y,r){noises.push({x,y,r,t:gt});}
function stampBlood(x,y,n,big){const g=DEC.getContext('2d');
 for(let i=0;i<n;i++){const a=R(0,6.28),d=R(0,big?42:20),bx=x+Math.cos(a)*d,by=y+Math.sin(a)*d,r=R(2,big?11:6);
  g.fillStyle='rgba('+ (60+Math.random()*50|0) +',8,12,'+R(.4,.8)+')';
  g.beginPath();g.ellipse(bx,by,r,r*R(.6,1),R(0,3),0,6.29);g.fill();}}
function stampBody(e){const g=DEC.getContext('2d');g.save();g.translate(e.x,e.y);g.rotate(e.fallAng);
 g.fillStyle='rgba(70,10,14,.55)';g.beginPath();g.ellipse(0,3,26,14,0,0,6.29);g.fill();
 drawHumanShape(g,e.type,e.ang,.95,true);g.restore();stampBlood(e.x,e.y,8,true);}
function stampCasing(x,y,a){const g=DEC.getContext('2d');g.save();g.translate(x,y);g.rotate(a);
 g.fillStyle='#8a6d2f';g.fillRect(-2,-1,4,2);g.restore();}

/* ================================================================
   GAME STATE
   ================================================================ */
let state='menu',L=null,FLOOR=null,DEC=null,LIGHT=null,lg=null;
let P=null,enemies=[],bullets=[],parts=[],noises=[],doors=[],picks=[];
let cam={x:0,y:0},shake=0,hurtT=0,flashT=0,gt=0,fadeA=1,fadeCb=null,lvlIdx=0;
let toasts=[],dmgInd=[],mflashes=[],bossRef=null,bossAggro=false,bossDead=false,locketGot=false;
let focusIn=false,crosshairPulse=0,objectiveTxt='',levelIntroT=0;

/* ---------------- weapons ---------------- */
const GUNS={
 pistol:{name:'P9 · SUPPRESSED',dmg:34,rate:.26,spread:.02,spd:1500,mag:12,rld:1.1,sil:true,len:15,kick:1.4,auto:false},

/* ================================================================
   LEVEL BUILDERS
   ================================================================ */
function mkL(w,h,amb,mode){return{w,h,amb,music:mode,walls:[],circles:[],lights:[],props:[],doors:[],
 enemies:[],picks:[],spawn:{x:100,y:100},exit:{x:0,y:0,w:10,h:10},exitNeed:null,obj:''};}
function W(L,x,y,w,h,k='wall'){L.walls.push({x,y,w,h,kind:k});}
function C(L,x,y,r,k){L.circles.push({x,y,r,kind:k});}

function buildL1(){const L=mkL(2300,1560,.74,'l1');
 W(L,0,0,2300,24);W(L,0,1536,2300,24);W(L,0,0,24,1560);W(L,2276,0,24,1560);
 W(L,24,440,420,20);W(L,560,24,20,280);W(L,560,400,20,60);
 W(L,80,80,150,60,'desk');W(L,300,340,120,44,'crateS');C(L,480,120,16,'plant');
 W(L,760,24,20,300);W(L,1080,24,20,300);W(L,830,180,180,100,'pool');
 W(L,1420,24,20,520);W(L,1420,660,20,880);
 W(L,900,700,110,110,'crate');W(L,1020,760,90,90,'crate');W(L,1140,640,90,90,'crate');
 W(L,1700,980,120,120,'crate');W(L,1830,1040,90,90,'crate');
 W(L,1600,240,140,70,'shelf');W(L,1800,240,140,70,'shelf');W(L,2000,240,140,70,'shelf');
 W(L,1000,1180,260,120,'van');
 C(L,1980,700,22,'barrel');C(L,2030,745,22,'barrel');C(L,1975,790,22,'barrel');
 doors=[];doors.push({x:560,y:300,w:18,h:100,open:0,vert:true,hinge:{x:569,y:400}});
 doors.push({x:760,y:324,w:18,h:100,open:0,vert:true,hinge:{x:769,y:424}});
 doors.push({x:1420,y:544,w:18,h:116,open:0,vert:true,hinge:{x:1429,y:660}});
 L.doors=doors;

   for(const d of doors)if(d.open<.7&&b.x>d.x&&b.x<d.x+d.w&&b.y>d.y&&b.y<d.y+d.h){dead=true;break;}
   if(dead)break;
   if(b.from==='p'){for(const e of enemies){if(e.state==='dead')continue;
     if(dist(b.x,b.y,e.x,e.y)<16){dead=true;damageEnemy(e,b.dmg,b);break;}}}
   else if(dist(b.x,b.y,P.x,P.y)<P.r+2){dead=true;hurtPlayer(b.dmg,b.x-b.vx*.01,b.y-b.vy*.01);
    for(let k=0;k<4;k++)parts.push({k:'blood',x:P.x,y:P.y,vx:R(-90,90),vy:R(-90,90),t:0,life:.4});}
  }
  if(dead)bullets.splice(i,1);}
 for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.t+=dt;
  if(p.t>p.life){if(p.k==='shell')stampCasing(p.x,p.y,p.a);parts.splice(i,1);continue;}
  p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.9;p.vy*=.9;}
 for(let i=mflashes.length-1;i>=0;i--){mflashes[i].t+=dt;if(mflashes[i].t>.05)mflashes.splice(i,1);}
 dmgInd=dmgInd.filter(d=>(d.t-=dt)>0);
 if(lvlIdx<2){if(P.x>L.exit.x&&P.x<L.exit.x+L.exit.w&&P.y>L.exit.y&&P.y<L.exit.y+L.exit.h)levelDone();}
 else{if(bossDead&&!locketGot&&objectiveTxt.indexOf('locket')<0)setObj('Retrieve the locket — Moreau’s desk');}
 const lookX=(mouse.x-VW/2)*.22,lookY=(mouse.y-VH/2)*.22;
 cam.x+= (P.x+lookX-VW/2-cam.x)*Math.min(1,6*dt);

 let ty=VH*.42;for(const t of toasts){t.age+=1/60;const a=clamp(Math.min(t.age*3,t.dur-t.age,1),0,1);
  cx.globalAlpha=a;cx.fillStyle='#ffd97a';cx.font='16px Georgia,serif';cx.fillText(t.t,VW/2,ty);ty+=26;cx.globalAlpha=1;}
 toasts=toasts.filter(t=>t.age<t.dur);
 if(bossRef&&!bossDead&&bossAggro){cx.fillStyle='rgba(0,0,0,.6)';rr(cx,VW/2-220,52,440,22,4);cx.fill();
  cx.fillStyle='#5a1015';cx.fillRect(VW/2-214,56,428,14);
  cx.fillStyle='#d83840';cx.fillRect(VW/2-214,56,428*bossRef.hp/bossRef.mhp,14);
  cx.fillStyle='#fff';cx.font='bold 12px monospace';cx.fillText('CASSIUS MOREAU',VW/2,67);}
 if(!(P.x>L.exit.x&&P.x<L.exit.x+L.exit.w&&P.y>L.exit.y&&P.y<L.exit.y+L.exit.h)){
  const ea=Math.atan2(L.exit.y+L.exit.h/2-P.y,L.exit.x+L.exit.w/2-P.x);
  cx.save();cx.translate(VW/2+Math.cos(ea)*90,VH/2+Math.sin(ea)*90);cx.rotate(ea);
  cx.fillStyle='rgba(120,255,170,.8)';cx.beginPath();cx.moveTo(14,0);cx.lineTo(-8,-9);cx.lineTo(-4,0);cx.lineTo(-8,9);cx.closePath();cx.fill();cx.restore();}
 const ms=.062,mw=L.w*ms,mh=L.h*ms,mx=VW-mw-16,my=16;
 cx.fillStyle='rgba(6,8,12,.72)';cx.fillRect(mx-6,my-6,mw+12,mh+12);
 cx.strokeStyle='rgba(200,200,210,.25)';cx.strokeRect(mx-6,my-6,mw+12,mh+12);
 cx.fillStyle='#2c3140';for(const w of L.walls)if(w.kind==='wall')cx.fillRect(mx+w.x*ms,my+w.y*ms,Math.max(1,w.w*ms),Math.max(1,w.h*ms));
 cx.fillStyle='#7affaa';cx.fillRect(mx+L.exit.x*ms-2,my+L.exit.y*ms-2,5,5);
 for(const e of enemies)if(e.state==='combat'){cx.fillStyle='#ff5544';cx.fillRect(mx+e.x*ms-1.5,my+e.y*ms-1.5,3,3);}
 cx.fillStyle='#fff';cx.beginPath();cx.arc(mx+P.x*ms,my+P.y*ms,3,0,6.29);cx.fill();
 cx.textAlign='left';}

let menuT=0;
function renderMenu(){menuT+=1/60;cx.fillStyle='rgba(3,4,8,.55)';cx.fillRect(0,0,VW,VH);
 for(let i=0;i<120;i++){const x=(i*167+menuT*380)%(VW+100)-50,y=(i*89+menuT*760)%(VH+60)-30;
  cx.strokeStyle='rgba(150,180,220,.16)';cx.beginPath();cx.moveTo(x,y);cx.lineTo(x-5,y+20);cx.stroke();}
 cx.textAlign='center';
 cx.fillStyle='#c9a45a';cx.font='16px monospace';cx.fillText('A   N O I R   A C T I O N   S T O R Y',VW/2,VH*.30);
 cx.fillStyle='#f0ece2';cx.font='bold '+Math.min(110,VW*.11)+'px Georgia,serif';
 cx.shadowColor='#c9a45a';cx.shadowBlur=24;cx.fillText('R E Q U I E M',VW/2,VH*.44);cx.shadowBlur=0;
 cx.fillStyle='#8a90a0';cx.font='italic 17px Georgia,serif';
 cx.fillText('“They say no one walks out of their past. He intends to walk straight through it.”',VW/2,VH*.51);
 cx.fillStyle='rgba(255,217,122,'+(.6+.4*Math.sin(menuT*3))+')';cx.font='bold 20px monospace';
 cx.fillText('— CLICK TO BEGIN —',VW/2,VH*.63);
 cx.fillStyle='#6a7080';cx.font='13px monospace';
 cx.fillText('WASD move · MOUSE aim · LMB fire · RMB focus-time · SHIFT sprint',VW/2,VH*.75);
 cx.fillText('E interact / kick doors · R reload · 1/2/3 weapons · M mute',VW/2,VH*.75+22);
 cx.fillStyle='#3f4450';cx.font='11px monospace';
 cx.fillText('inspired by John Wick & Door Kickers — synthesized sound, hand-built levels',VW/2,VH*.92);
 grainOver(.05);cx.textAlign='left';}
const DEATHQ=['“Death follows him like a shadow. Tonight it caught up.”','“Even legends run out of doors to kick.”','“The rain keeps falling. So must he — but not today.”','“She said: go live. Try again.”'];
function renderDead(){cx.fillStyle='rgba(20,2,6,.62)';cx.fillRect(0,0,VW,VH);
 cx.textAlign='center';cx.fillStyle='#d83840';cx.font='bold 64px Georgia,serif';
 cx.shadowColor='#000';cx.shadowBlur=18;cx.fillText('YOU DIED',VW/2,VH*.44);cx.shadowBlur=0;
 cx.fillStyle='#c8b8a8';cx.font='italic 17px Georgia,serif';
 cx.fillText(DEATHQ[lvlIdx%DEATHQ.length],VW/2,VH*.52);
 cx.fillStyle='rgba(255,255,255,'+(.5+.4*Math.sin(gt*3))+')';cx.font='16px monospace';
 cx.fillText('CLICK / ENTER — RISE AGAIN',VW/2,VH*.62);cx.textAlign='left';}
function renderEnd(){cx.fillStyle='#020304';cx.fillRect(0,0,VW,VH);
 cx.textAlign='center';
 cx.fillStyle='#c9a45a';cx.font='bold 54px Georgia,serif';cx.fillText('R E Q U I E M',VW/2,VH*.4);
 cx.fillStyle='#9aa0ac';cx.font='16px monospace';
 cx.fillText('kills this night: '+P.killCount+'   ·   the promise: kept',VW/2,VH*.5);
 cx.fillStyle='#6a7080';cx.font='italic 15px Georgia,serif';
 cx.fillText('for Evelyn — and for everyone who kept a promise.',VW/2,VH*.57);
 cx.fillStyle='rgba(255,255,255,'+(.5+.4*Math.sin(menuT*3))+')';cx.font='14px monospace';
 cx.fillText('CLICK — RETURN TO TITLE',VW/2,VH*.72);cx.textAlign='left';grainOver(.06);}

let lastT=performance.now();
function frame(now){const dt=Math.min(.05,(now-lastT)/1000);lastT=now;
 if(state==='play')updatePlay(dt);
 else if(state==='cut')updateCut(dt);
 else if(state==='menu'||state==='end')tickMusic();
 else if(state==='dead'){gt+=dt;tickMusic();}
 render();
 requestAnimationFrame(frame);}
requestAnimationFrame(frame);
</script>
